name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or resume (for example v0.2.4)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Test and build the tagged source
    if: github.repository == 'oh-dsh-plugins/dsh-agentdeck'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      source-commit: ${{ steps.version.outputs.source-commit }}
    steps:
      - name: Check out the version tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Validate tag, package version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$/.test(pkg.version) || tag !== `v${pkg.version}`) throw new Error('Tag must exactly match v<package.json version>');
          if (pkg.name !== 'dsh-agentdeck' || pkg.private || pkg.publishConfig?.registry !== 'https://registry.npmjs.org/') throw new Error('Unexpected publication target');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (git('rev-parse', 'HEAD') !== git('rev-parse', `refs/tags/${tag}^{commit}`)) throw new Error('Checkout must be the exact version tag');
          git('merge-base', '--is-ancestor', 'HEAD', 'origin/main');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${pkg.version}\ndist-tag=${pkg.version.includes('-') ? 'next' : 'latest'}\nsource-commit=${git('rev-parse', 'HEAD')}\n`);
          NODE
      - name: Install DSH build baseline and native manager dependency
        run: npm install --global --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.3 pnpm@11.25.0
      - name: Install source dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Link public host packages
        run: npm run dev:link-host
      - name: Install isolated BrowserSkill fixtures
        run: npm install --prefix .ci-browser --ignore-scripts --no-audit --no-fund @wxg-prc-cpg/browser-skill-dsh-plugin@0.5.0
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run tests without a live browser or paid model
        env:
          AGENTDECK_BROWSER_MODULE_BASE: ${{ github.workspace }}/.ci-browser
        run: npm test
      - name: Verify distributable contents
        run: npm run check:pack
      - name: Pack the tested build
        run: mkdir -p artifacts && npm pack --ignore-scripts --pack-destination artifacts
      - name: Verify the same archive with native DSH install and upgrades
        run: npm run test:compatibility
      - name: Preserve the tested npm archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tested-npm-archive
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm and GitHub Release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      DIST_TAG: ${{ needs.check.outputs.dist-tag }}
      SOURCE_COMMIT: ${{ needs.check.outputs.source-commit }}
    steps:
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use the verified npm trusted-publishing CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.19.1
      - name: Download the tested build
        uses: actions/download-artifact@v8.0.2
        with:
          name: tested-npm-archive
          path: artifacts
      - name: Check whether this npm version already exists
        id: npm
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const archive = readFileSync(`artifacts/dsh-agentdeck-${process.env.VERSION}.tgz`);
          const integrity = value => `sha512-${createHash('sha512').update(value).digest('base64')}`;
          const response = await fetch(`https://registry.npmjs.org/dsh-agentdeck/${process.env.VERSION}`);
          let repacked = false;
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`npm metadata: HTTP ${response.status}`);
            const published = await response.json();
            if (published.dist?.integrity !== integrity(archive)) {
              const download = await fetch(`https://registry.npmjs.org/dsh-agentdeck/-/dsh-agentdeck-${process.env.VERSION}.tgz`);
              if (!download.ok) throw new Error(`Existing npm archive: HTTP ${download.status}`);
              const original = Buffer.from(await download.arrayBuffer());
              if (integrity(original) !== published.dist?.integrity) throw new Error('Existing npm archive failed its registry integrity check');
              writeFileSync('artifacts/published.tgz', original);
              repacked = true;
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.ok}\nrepacked=${repacked}\n`);
          NODE
      - name: Verify every file before retaining an existing original archive
        if: steps.npm.outputs.repacked == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path, PurePosixPath
          root = Path('artifacts').resolve()
          tested = root / f"dsh-agentdeck-{os.environ['VERSION']}.tgz"
          original = root / 'published.tgz'
          if tested.resolve().parent != root or original.resolve().parent != root:
              raise RuntimeError('Unexpected archive path')
          def manifest(path):
              rows = {}
              with tarfile.open(path, 'r:gz') as archive:
                  for entry in archive.getmembers():
                      parts = PurePosixPath(entry.name).parts
                      if not entry.isfile() or not parts or parts[0] != 'package' or '..' in parts or entry.name in rows:
                          raise RuntimeError('Archive must contain unique regular package files')
                      rows[entry.name] = (entry.mode & ~0o044, hashlib.sha256(archive.extractfile(entry).read()).hexdigest())
              if not rows:
                  raise RuntimeError('Empty npm archive')
              return rows
          if manifest(tested) != manifest(original):
              raise RuntimeError('Published version differs in file content, type, write or executable permissions. Bump the version.')
          os.replace(original, tested)
          print('All package files and remaining permissions match; retaining the immutable original npm archive.')
          PY
      - name: Record integrity and checksums for the selected archive
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const filename = `dsh-agentdeck-${process.env.VERSION}.tgz`;
          const archive = readFileSync(`artifacts/${filename}`);
          writeFileSync('artifacts/expected-integrity.txt', `sha512-${createHash('sha512').update(archive).digest('base64')}`);
          writeFileSync('artifacts/SHA256SUMS', `${createHash('sha256').update(archive).digest('hex')}  ${filename}\n`);
          NODE
      - name: Require provenance to identify the tested tag
        if: steps.npm.outputs.exists != 'true'
        run: |
          node --input-type=module <<'NODE'
          if (process.env.GITHUB_SHA !== process.env.SOURCE_COMMIT || process.env.GITHUB_REF !== `refs/tags/${process.env.RELEASE_TAG}`) {
            throw new Error('An unpublished version must run from its own tag so npm provenance identifies the tested source. Dispatch with --ref <tag>, or push that tag.');
          }
          NODE
      - name: Publish the tested archive through npm OIDC
        if: steps.npm.outputs.exists != 'true'
        run: npm publish "./artifacts/dsh-agentdeck-${VERSION}.tgz" --access public --provenance --ignore-scripts --tag "$DIST_TAG" --registry https://registry.npmjs.org/
      - name: Verify public npm metadata and downloaded bytes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = readFileSync('artifacts/expected-integrity.txt', 'utf8');
          const deadline = performance.now() + 5 * 60_000;
          async function fetchPublished(path, label) {
            let saw404 = false;
            for (;;) {
              const remaining = Math.ceil(deadline - performance.now());
              if (remaining <= 0) {
                const reason = saw404 ? 'HTTP 404 after waiting' : 'verification timed out';
                throw new Error(`${label}: ${reason} (shared limit: 5 minutes)`);
              }
              const response = await fetch(`https://registry.npmjs.org/dsh-agentdeck/${path}?release=${Date.now()}`, {
                signal: AbortSignal.timeout(remaining),
              });
              if (response.ok) return response;
              if (response.status !== 404) throw new Error(`${label}: HTTP ${response.status}`);
              if (!saw404) console.log(`${label}: HTTP 404, waiting for npm registry propagation`);
              saw404 = true;
              await response.body?.cancel();
              const delay = Math.min(10_000, deadline - performance.now());
              if (delay > 0) await new Promise(resolve => setTimeout(resolve, delay));
            }
          }
          const metadata = await fetchPublished(process.env.VERSION, 'Published npm metadata');
          const published = await metadata.json();
          if (published.dist?.integrity !== expected) throw new Error('Published npm integrity differs from the tested archive');
          const response = await fetchPublished(`-/dsh-agentdeck-${process.env.VERSION}.tgz`, 'Published npm archive');
          const actual = `sha512-${createHash('sha512').update(Buffer.from(await response.arrayBuffer())).digest('base64')}`;
          if (actual !== expected) throw new Error('Downloaded npm archive differs from the tested build');
          console.log(`Verified npm dsh-agentdeck@${process.env.VERSION}`);
          NODE
      - name: Create or complete the GitHub Release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const files = [`dsh-agentdeck-${process.env.VERSION}.tgz`, 'SHA256SUMS'];
          const gh = (...args) => execFileSync('gh', args, { stdio: 'inherit' });
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
          if (response.status === 404) {
            writeFileSync('artifacts/release-notes.md', `Install / 安装：\n\n\`dsh plugin --profile web add dsh-agentdeck@${process.env.VERSION}\`\n\nThe .tgz asset is the tested npm package. Verify it with SHA256SUMS.\n.tgz 附件为通过测试的 npm 安装包，可用 SHA256SUMS 校验。\n\nSee README.md / README.zh-CN.md for compatibility and usage.\n`);
            gh('release', 'create', tag, ...files.map(file => `artifacts/${file}`), '--repo', repo, '--verify-tag', '--title', `DSH AgentDeck ${tag}`, '--generate-notes', '--notes-file', 'artifacts/release-notes.md', ...(process.env.DIST_TAG === 'next' ? ['--prerelease'] : []));
          } else {
            if (!response.ok) throw new Error(`GitHub Release: HTTP ${response.status}`);
            const release = await response.json();
            mkdirSync('artifacts/existing', { recursive: true });
            for (const file of files) {
              if (release.assets.some(asset => asset.name === file)) {
                gh('release', 'download', tag, '--repo', repo, '--pattern', file, '--dir', 'artifacts/existing');
                if (!readFileSync(`artifacts/${file}`).equals(readFileSync(`artifacts/existing/${file}`))) throw new Error(`Existing Release asset differs: ${file}`);
              } else {
                gh('release', 'upload', tag, `artifacts/${file}`, '--repo', repo);
              }
            }
          }
          NODE
