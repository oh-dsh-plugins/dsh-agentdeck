name: Bug report / 问题报告
description: Report reproducible behavior with redacted diagnostics.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the security policy instead of a public issue.
        请勿粘贴密钥、配对链接、私有路径或完整会话内容；安全漏洞请使用安全报告渠道。
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: AgentDeck, DSH, Node.js and OS; BrowserSkill if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Minimal steps and configuration with sensitive values removed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics / 脱敏诊断
      description: Relevant error text or cropped screenshots only.
